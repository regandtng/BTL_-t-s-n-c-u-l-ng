<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04231a"/>
      <stop offset="0.45" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.9" r="0.8">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="shuttle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- Perspective badminton court -->
  <g transform="translate(800 900)" opacity="0.9">
    <!-- court floor -->
    <polygon points="-760,0 760,0 260,-460 -260,-460" fill="url(#court)"/>
    <!-- outer boundary -->
    <polygon points="-760,0 760,0 260,-460 -260,-460" fill="none" stroke="#a7f3d0" stroke-opacity="0.55" stroke-width="3"/>
    <!-- singles sideline -->
    <polygon points="-600,0 600,0 205,-460 -205,-460" fill="none" stroke="#a7f3d0" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- long service lines -->
    <line x1="-470" y1="-110" x2="470" y2="-110" stroke="#a7f3d0" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="-590" y1="-290" x2="590" y2="-290" stroke="#a7f3d0" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- net -->
    <line x1="-260" y1="-230" x2="260" y2="-230" stroke="#ffffff" stroke-opacity="0.75" stroke-width="4"/>
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1">
      <line x1="-260" y1="-230" x2="-260" y2="-460"/>
      <line x1="-130" y1="-230" x2="-130" y2="-460"/>
      <line x1="130" y1="-230" x2="130" y2="-460"/>
      <line x1="260" y1="-230" x2="260" y2="-460"/>
    </g>
    <!-- center line -->
    <line x1="0" y1="-110" x2="0" y2="0" stroke="#a7f3d0" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>

  <!-- Large decorative shuttlecock -->
  <g transform="translate(1230 250) rotate(-24)" opacity="0.95">
    <ellipse cx="0" cy="0" rx="120" ry="150" fill="#ffffff" opacity="0.08" filter="url(#soft)"/>
    <path d="M0 -150 L70 -40 L0 10 Z" fill="url(#shuttle)" opacity="0.85"/>
    <path d="M0 -150 L-70 -40 L0 10 Z" fill="#e2e8f0" opacity="0.85"/>
    <path d="M0 -150 L0 -20 L0 10 Z" fill="#f8fafc" opacity="0.9"/>
    <path d="M-55 -45 L55 -45" stroke="#94a3b8" stroke-width="2" opacity="0.6"/>
    <path d="M-40 -85 L40 -85" stroke="#94a3b8" stroke-width="2" opacity="0.5"/>
    <path d="M-25 -120 L25 -120" stroke="#94a3b8" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="22" r="20" fill="#f1f5f9"/>
    <circle cx="0" cy="22" r="20" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- Floating shuttlecock small -->
  <g transform="translate(300 200) rotate(18)" opacity="0.6">
    <path d="M0 -60 L28 -16 L0 4 Z" fill="#ffffff" opacity="0.6"/>
    <path d="M0 -60 L-28 -16 L0 4 Z" fill="#cbd5e1" opacity="0.6"/>
    <circle cx="0" cy="10" r="8" fill="#e2e8f0"/>
  </g>

  <!-- subtle grid dots -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="120" cy="120" r="3"/><circle cx="220" cy="120" r="3"/><circle cx="320" cy="120" r="3"/>
    <circle cx="120" cy="220" r="3"/><circle cx="220" cy="220" r="3"/><circle cx="320" cy="220" r="3"/>
  </g>

  <!-- bottom fade -->
  <rect y="640" width="1600" height="260" fill="#0f172a" opacity="0.35"/>
</svg>
